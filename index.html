<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16382c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="License Trail">
  <meta name="description" content="An unofficial mobile study game for the Connecticut real estate salesperson exam.">
  <title>CT License Trail</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#0e241c"/>
          <path d="M6 42h52" stroke="#f0b45a" stroke-width="4"/>
          <path d="M8 42c8-14 14-14 22 0" fill="none" stroke="#d7e3da" stroke-width="3"/>
          <rect x="30" y="30" width="22" height="10" rx="3" fill="#f4efe6"/>
          <circle cx="36" cy="40" r="3" fill="#1c140c"/>
          <circle cx="47" cy="40" r="3" fill="#1c140c"/>
          <circle cx="48" cy="33" r="2" fill="#f0b45a"/>
        </svg>
        <div>
          <h1>CT License Trail</h1>
          <p>Student to licensed agent</p>
        </div>
      </div>
      <div class="stats">
        <span class="pill" id="level-name">Student</span>
        <span class="pill" id="streak-pill">0-day streak</span>
        <span class="pill" id="count-pill">0/0 correct</span>
      </div>
    </header>
    <main id="main"></main>
    <nav class="tabs" aria-label="Primary">
      <button type="button" data-tab="home" aria-label="Road">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 16h16v2H4zm2-4 3-6h6l3 6H6zm5-8h2v3h-2z"/></svg>
        Road
      </button>
      <button type="button" data-tab="map" aria-label="Towns">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>
        Towns
      </button>
      <button type="button" data-tab="math" aria-label="Math Pass">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 4h14v4H5zm0 6h6v10H5zm8 0h6v4h-6zm0 6h6v4h-6z"/></svg>
        Math
      </button>
      <button type="button" data-tab="exam" aria-label="Mock exam">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 2h9l5 5v15H6zm8 1.5V8h4.5zM8 12h8v2H8zm0 4h8v2H8z"/></svg>
        Exam
      </button>
      <button type="button" data-tab="review" aria-label="Review">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 6V3L8 7l4 4V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        Review
      </button>
      <button type="button" data-tab="daily" aria-label="Daily crossword">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 2h2v2h-2zm3 0h2v2h-2zm-3 3h2v2h-2zm3 0h2v2h-2z"/></svg>
        Daily
      </button>
    </nav>
  </div>
  <div id="live" class="sr" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
